<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>8F A1 住家 · AI 室內設計提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Segoe UI",sans-serif;
  --text-h1:700 28px/1.2 var(--font-family);--letter-spacing-h1:0;
  --text-h2:600 20px/1.3 var(--font-family);--letter-spacing-h2:0;
  --text-body:400 16px/1.5 var(--font-family);--letter-spacing-body:0;
  --text-caption:500 13px/1.4 var(--font-family);--letter-spacing-caption:0;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--sp-8:32px;--sp-12:48px;
  --radius-sm:8px;
  --radius-md:16px;--radius-lg:24px;--radius-pill:999px;
  --color-brand:#BD6A4A;        /* 統一品牌陶土(對齊落地頁 glass.css,取代偏亮的科技橘 #E07A3E) */
  --color-brand-hover:#A4583C;
  --color-brand-bg:rgba(189,106,74,.12);
  --font-display:'Fraunces','Noto Serif TC',Georgia,'PingFang TC',serif;  /* 標題襯線,對齊落地頁品牌調性 */
  --color-ink-blue:#38525f;
  --color-sage:#7b8f84;
  --bg-base:#F5F4F1;
  --bg-surface:#FFFFFF;
  --bg-elevated:rgba(var(--glass-rgb),.85);
  --text-primary:#1D1D1F;
  --text-secondary:#86868B;
  --text-tertiary:#D2D2D7;
  --hairline:rgba(0,0,0,.08);
  --material-blur:blur(24px) saturate(180%);
  --shadow-sm:0 2px 8px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  --shadow-md:0 8px 24px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:0 16px 48px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --spring-fast:.3s cubic-bezier(.25,1,.5,1);
  --spring-bouncy:.5s cubic-bezier(.34,1.56,.64,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,16px);
  --safe-left:env(safe-area-inset-left,0px);
  --left-col-w:320px;--right-col-w:360px;--mobile-header-h:76px;--mobile-tabbar-h:76px;
  --cream:var(--bg-base);--cream2:#EFE6D6;--ink:var(--text-primary);--ink2:var(--text-secondary);--accent:var(--color-brand);--line:var(--hairline);--card:var(--bg-surface);
  --glass-rgb:255,255,255;      /* 玻璃面/邊 RGB(dark mode 翻深暖);各 site alpha 保留 */
}
/* FR: 深色模式 — 翻 token + 硬編碼漸層;3D 場景不變(室內本身的光) */
@media (prefers-color-scheme:dark){
  :root{
    --glass-rgb:46,42,35;
    --bg-base:#15130F;--bg-surface:#211E18;--bg-elevated:rgba(33,30,24,.82);
    --text-primary:#EFEAE2;--text-secondary:#B0A89C;--text-tertiary:#6b645a;
    --hairline:rgba(255,255,255,.10);--cream2:#2a2620;
    --color-brand-bg:rgba(189,106,74,.20);
  }
  body{background:linear-gradient(135deg,#16130f 0%,#1b1813 48%,#14171a 100%)!important;}
  #mid{background:linear-gradient(145deg,#1a1712 0%,#16130f 47%,#141a1a 100%)!important;}
  #planwrap{background:linear-gradient(180deg,#1b1813,#15130f)!important;}
  #plan2d{background:#1b1813!important;filter:invert(.9) hue-rotate(180deg)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font:var(--text-body);letter-spacing:var(--letter-spacing-body);
  color:var(--text-primary);
  background:linear-gradient(135deg,#f7f4ef 0%,#e9e2d7 48%,#dce6e1 100%);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(var(--glass-rgb),.72),rgba(245,244,241,0) 34%,rgba(56,82,95,.12));}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid rgba(224,122,62,.55);outline-offset:2px}
#app{
  position:relative;isolation:isolate;display:grid;width:100vw;height:100vh;height:100svh;
  grid-template-columns:var(--left-col-w) minmax(0,1fr) var(--right-col-w);grid-template-areas:"left mid right";
  background:var(--bg-base);overflow:hidden;
}
header{
  grid-area:left;align-self:start;z-index:25;display:grid;gap:var(--sp-2);
  padding:var(--sp-6) var(--sp-6) var(--sp-4);
  background:linear-gradient(180deg,rgba(var(--glass-rgb),.94),rgba(var(--glass-rgb),.78));
  border-bottom:1px solid var(--hairline);
  backdrop-filter:var(--material-blur);-webkit-backdrop-filter:var(--material-blur);
}
header .logo{font:var(--text-h1);font-family:var(--font-display);letter-spacing:.2px;color:var(--text-primary)}
header .logo span{display:block;margin-top:var(--sp-1);font:var(--text-caption);letter-spacing:var(--letter-spacing-caption);color:var(--color-brand)}
header .meta{font:var(--text-caption);line-height:1.5;letter-spacing:var(--letter-spacing-caption);color:var(--text-secondary)}
header .sp{display:none}
.panel{min-height:0;background:var(--bg-surface);overflow:hidden}
#left{
  grid-area:left;display:flex;flex-direction:column;padding-top:116px;padding-bottom:168px;
  border-right:1px solid var(--hairline);background:rgba(var(--glass-rgb),.92);
}
#mid{
  grid-area:mid;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#fbf8f2 0%,#efe8dd 47%,#dde8e1 100%);
}
#mid::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(var(--glass-rgb),.55),rgba(var(--glass-rgb),0) 46%,rgba(56,82,95,.14));}
#right{
  grid-area:right;display:flex;flex-direction:column;border-left:1px solid var(--hairline);
  background:rgba(var(--glass-rgb),.94);overflow:hidden;
}
#bar{
  grid-area:left;align-self:end;z-index:26;display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-3);
  padding:var(--sp-3) var(--sp-4) var(--sp-6);background:linear-gradient(0deg,rgba(var(--glass-rgb),.96),rgba(var(--glass-rgb),.82));
  border-top:1px solid var(--hairline);backdrop-filter:var(--material-blur);-webkit-backdrop-filter:var(--material-blur);
}
#schemes,#roomchips{display:flex;gap:var(--sp-2);flex-wrap:nowrap;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#schemes::-webkit-scrollbar,#roomchips::-webkit-scrollbar{display:none}
.barlabel{align-self:center;font:var(--text-caption);letter-spacing:var(--letter-spacing-caption);color:var(--text-secondary)}
.tabs{
  display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--hairline);background:rgba(245,244,241,.58);flex-wrap:wrap;
}
.tabs button,.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);flex:0 0 auto;min-height:36px;
  padding:7px 13px;border-radius:var(--radius-pill);border:1px solid var(--hairline);
  background:rgba(var(--glass-rgb),.72);color:var(--text-secondary);font:var(--text-caption);
  letter-spacing:var(--letter-spacing-caption);cursor:pointer;white-space:nowrap;
  transition:transform var(--spring-fast),opacity var(--spring-fast),background-color var(--spring-fast),color var(--spring-fast),border-color var(--spring-fast),box-shadow var(--spring-fast);
}
.chip:empty{display:none}
.tabs button:hover,.chip:hover{transform:translateY(-1px);color:var(--text-primary);box-shadow:var(--shadow-sm)}
.tabs button.on,.chip.on{
  background:var(--color-brand);color:#fff;border-color:var(--color-brand);
  box-shadow:0 4px 12px rgba(224,122,62,.30);
}
.chip-swatch{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(var(--glass-rgb),.55),0 0 0 1px rgba(0,0,0,.05)}
#planwrap{flex:1 1 auto;min-height:220px;overflow:auto;padding:var(--sp-4);background:linear-gradient(180deg,#fff,#f7f5f0)}
#planraw{width:100%;border-radius:var(--radius-sm);border:0;display:none;box-shadow:none}
#plan2d{width:100%;height:auto;display:block;background:#fffaf2;border-radius:var(--radius-sm);border:0;box-shadow:none}
.rm{cursor:pointer;transition:opacity var(--spring-fast)}.rm:hover{opacity:.86}
.pwall{cursor:pointer}.pwall.mov:hover{stroke:#d98e4a!important}
.pwall.sel{stroke:#d98e4a!important;stroke-width:9!important}
.pwall.lockflash{stroke:#e0533a!important;stroke-width:8!important}
#walledit{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--hairline);font:var(--text-caption);background:var(--bg-surface);color:var(--text-primary)}
#walledit b{color:var(--color-brand)}
.we-row{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap}
.we-row button,.apply button{
  flex:1;min-width:84px;min-height:36px;background:var(--bg-base);border:1px solid var(--hairline);
  border-radius:var(--radius-sm);padding:8px 10px;font:var(--text-caption);color:var(--text-primary);cursor:pointer;
  transition:transform var(--spring-fast),background-color var(--spring-fast),color var(--spring-fast),border-color var(--spring-fast);
}
.we-row button:hover,.apply button:hover{transform:translateY(-1px);border-color:rgba(224,122,62,.36)}
.we-row button.del{background:#fff0eb;border-color:#efc1b1;color:#a23c22}
.we-hint{font-size:12px;color:var(--text-secondary);margin-top:var(--sp-2);line-height:1.55}
.roominfo{flex:0 0 auto;max-height:152px;overflow:auto;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--hairline);font:var(--text-caption);line-height:1.7;min-height:88px;background:rgba(var(--glass-rgb),.92)}
.roominfo b{color:var(--color-brand)}
#c{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block}
#views{display:none}
.btns{
  position:absolute;left:50%;right:auto;bottom:var(--sp-6);top:auto;z-index:18;
  display:flex;align-items:center;gap:var(--sp-2);max-width:calc(100% - 48px);padding:var(--sp-2);
  border:1px solid rgba(var(--glass-rgb),.66);border-radius:var(--radius-pill);
  background:var(--bg-elevated);backdrop-filter:var(--material-blur);-webkit-backdrop-filter:var(--material-blur);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(var(--glass-rgb),.66);transform:translateX(-50%);
}
#pbtns{left:50%!important;right:auto!important;bottom:calc(var(--sp-6) + 58px)!important;top:auto!important;transform:translateX(-50%)!important}
.btns button,.tool-btn{
  min-width:42px;height:42px;padding:0 13px;border:0;border-radius:var(--radius-pill);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  color:var(--text-secondary);background:rgba(var(--glass-rgb),.78);box-shadow:var(--shadow-sm);
  cursor:pointer;transition:transform var(--spring-fast),opacity var(--spring-fast),background-color var(--spring-fast),color var(--spring-fast),box-shadow var(--spring-fast);
}
.btns button:hover,.tool-btn:hover{transform:scale(1.05);color:var(--text-primary)}
.btns button.on,.tool-btn.on{background:var(--color-brand);color:#fff;box-shadow:0 6px 16px rgba(189,106,74,.30)}
.btns button span,.tool-btn span{white-space:nowrap;line-height:1}
.icon{width:24px;height:24px;flex:0 0 24px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* AI 設計師標題的 sparkle:實心品牌色圓徽,不再是細灰描邊 */
.rhead .icon{flex:0 0 30px;width:30px;height:30px;padding:5px;border-radius:50%;background:var(--color-brand-bg);fill:var(--color-brand);stroke:none;box-sizing:border-box}
.modepill{
  position:absolute;left:50%;bottom:calc(var(--sp-6) + 116px);z-index:18;transform:translateX(-50%);
  max-width:calc(100% - 48px);padding:7px 14px;border:1px solid rgba(var(--glass-rgb),.62);
  border-radius:var(--radius-pill);background:var(--bg-elevated);color:var(--text-primary);
  font:var(--text-caption);box-shadow:var(--shadow-sm);backdrop-filter:var(--material-blur);-webkit-backdrop-filter:var(--material-blur);
  white-space:nowrap;transition:opacity var(--spring-fast),transform var(--spring-fast);
}
.modepill.hint-faded{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(6px)}
.minimap-hud{
  position:absolute;top:var(--sp-6);left:var(--sp-6);z-index:7;width:132px;height:132px;
  overflow:hidden;border:1px solid rgba(var(--glass-rgb),.68);border-radius:var(--radius-md);
  background:var(--bg-elevated);backdrop-filter:var(--material-blur);-webkit-backdrop-filter:var(--material-blur);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(var(--glass-rgb),.66);cursor:pointer;transform-origin:top left;
  transition:transform var(--spring-bouncy),opacity var(--spring-fast),border-radius var(--spring-fast);
}
.minimap-hud.collapsed{transform:scale(.52);border-radius:var(--radius-sm)}
#minimap-canvas{width:100%;height:100%;display:block}
#photoview{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#photoclose{transition:transform var(--spring-fast),opacity var(--spring-fast)}
#photoclose:hover{transform:translateY(-1px)}
.drawer-handle-area{display:none}
.mobile-schemes{display:none}
.rhead{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);
  border-bottom:1px solid var(--hairline);font:var(--text-h2);letter-spacing:var(--letter-spacing-h2);
  background:rgba(var(--glass-rgb),.72);
}
.rhead small{display:block;margin-top:2px;font:var(--text-caption);letter-spacing:var(--letter-spacing-caption);color:var(--text-secondary)}
.prompt-chips{display:flex;gap:var(--sp-2);min-width:0;padding:var(--sp-3) var(--sp-4) 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.prompt-chips::-webkit-scrollbar{display:none}
.prompt-chips button{
  flex:0 0 auto;min-height:36px;background:var(--color-brand-bg);border:1px solid rgba(224,122,62,.18);
  color:var(--color-brand-hover);border-radius:var(--radius-pill);padding:8px 12px;font:var(--text-caption);cursor:pointer;
  white-space:nowrap;
  transition:transform var(--spring-fast),background-color var(--spring-fast),opacity var(--spring-fast);
}
.prompt-chips button:hover{transform:translateY(-1px);background:rgba(224,122,62,.18)}
#chat{flex:1;min-height:0;overflow:auto;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);background:linear-gradient(180deg,rgba(var(--glass-rgb),.42),rgba(var(--glass-rgb),.7))}
.msg{
  max-width:90%;padding:10px 13px;border-radius:16px;font:var(--text-caption);line-height:1.62;
  box-shadow:var(--shadow-sm);animation:messageIn var(--spring-bouncy) both;
}
.ai{background:var(--bg-surface);align-self:flex-start;border-bottom-left-radius:5px;color:var(--text-primary);border:1px solid var(--hairline)}
.me{background:var(--color-brand);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.apply{margin-top:var(--sp-2);display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.apply button{flex:0 1 auto;color:var(--color-brand-hover);background:var(--color-brand-bg);border:1px solid rgba(189,106,74,.28);border-radius:var(--radius-pill);padding:7px 13px;font-weight:600}
.ai-typing{display:inline-flex;gap:5px;align-items:center;height:16px}
.ai-typing-dot{width:6px;height:6px;border-radius:50%;background:var(--color-brand);animation:typingWave 1.4s infinite ease-in-out both}
.ai-typing-dot:nth-child(1){animation-delay:-.32s}.ai-typing-dot:nth-child(2){animation-delay:-.16s}
#chatin{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-top:1px solid var(--hairline);background:rgba(var(--glass-rgb),.92)}
#chatin input{
  flex:1;min-width:0;border:1px solid var(--hairline);border-radius:var(--radius-pill);
  background:var(--bg-base);padding:11px 14px;font-size:15px;color:var(--text-primary);outline:none;
  transition:border-color var(--spring-fast),background-color var(--spring-fast),box-shadow var(--spring-fast);
}
#chatin input:focus{background:#fff;border-color:rgba(224,122,62,.45);box-shadow:0 0 0 4px rgba(224,122,62,.10)}
#chatin button,.sharebtn{
  flex:0 0 auto;
  min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  background:var(--text-primary);color:#fff;border:0;border-radius:var(--radius-pill);
  padding:0 15px;font:var(--text-caption);cursor:pointer;
  transition:transform var(--spring-fast),background-color var(--spring-fast),opacity var(--spring-fast);
}
#chatin button:hover,.sharebtn:hover{transform:translateY(-1px);background:#000}
.sharebtn{grid-column:1/-1;width:100%;background:var(--color-ink-blue)}
#mtabs,.bottom-nav{display:none}
.nav-item svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:var(--radius-sm)}
body.shotmode header,body.shotmode #mtabs,body.shotmode #left,body.shotmode #right,body.shotmode #bar,body.shotmode .btns,body.shotmode #views,body.shotmode .modepill,body.shotmode .minimap-hud,body.shotmode .bottom-nav,body.shotmode #furnpanel{display:none!important}
/* ===== 家具面板 ===== */
#furnpanel{position:absolute;top:54px;right:64px;z-index:7;background:rgba(var(--glass-rgb),.93);backdrop-filter:blur(8px);border:1px solid var(--hairline);border-radius:14px;padding:10px 12px;width:216px;max-height:68%;overflow-y:auto;box-shadow:0 10px 28px rgba(0,0,0,.14)}
#furnpanel h4{margin:0 0 6px;font-size:13px;color:var(--ink)}
#furnpanel .fp-note{font-size:11px;color:var(--text-secondary,#8a8174);margin-bottom:8px;line-height:1.5}
#furnpanel .fp-row{display:flex;gap:6px;margin-bottom:6px}
#furnpanel button{flex:1;min-height:36px;border-radius:9px;border:1px solid var(--hairline);background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink);transition:background .15s}
#furnpanel button:hover{background:var(--bg-base,#f5f3ee)}
#furnpanel button.on{background:#3a352d;color:#fff;border-color:#3a352d}
#furnpanel .fp-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:1px 2px 4px 12px;font-size:12px;color:var(--text-secondary)}
#furnpanel .fp-item button{flex:0 0 auto;min-height:28px;padding:0 9px;font-size:11.5px;border-radius:7px}
@media(max-width:767px){#furnpanel .fp-item button{min-height:38px}}
@media (max-width:767px){
  #furnpanel{right:10px;left:10px;width:auto;top:auto;bottom:72px;max-height:46%}
  #furnpanel button{min-height:44px;font-size:13.5px}
}
body.shotmode #app{grid-template-columns:1fr!important;grid-template-areas:"mid"!important;width:100vw!important;height:100vh!important;border-radius:0!important;box-shadow:none!important}
body.shotmode #mid{background:#f5f4f1}
@keyframes typingWave{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes messageIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes panelIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@media(min-width:1200px){
  body{display:grid;place-items:center;padding:24px}
  #app{
    width:min(1440px,calc(100vw - 48px));height:min(900px,calc(100vh - 48px));height:min(900px,calc(100svh - 48px));
    border:1px solid rgba(var(--glass-rgb),.68);border-radius:30px;box-shadow:0 28px 80px rgba(29,29,31,.16),0 8px 24px rgba(29,29,31,.08);
  }
}
@media(min-width:768px) and (max-width:1199px){
  :root{--tablet-right-w:clamp(320px,34vw,360px)}
  #app{grid-template-columns:360px minmax(0,1fr);grid-template-areas:"left mid"}
  header,#bar{grid-area:left}
  #left{grid-area:left;padding-top:116px;padding-bottom:164px}
  #right{
    position:absolute;right:var(--sp-4);bottom:var(--sp-4);z-index:30;width:var(--tablet-right-w);height:min(620px,60vh);
    border:1px solid rgba(var(--glass-rgb),.68);border-radius:var(--radius-md);
    background:var(--bg-elevated);backdrop-filter:var(--material-blur);-webkit-backdrop-filter:var(--material-blur);
    box-shadow:var(--shadow-lg);transform:none!important;
  }
  .bottom-nav,#mtabs,.drawer-handle-area{display:none!important}
  .btns{
    left:clamp(132px,calc((100% - var(--tablet-right-w) - var(--sp-6)) / 2),50%);
    bottom:var(--sp-4);
  }
  #pbtns{

      (document.body||document.documentElement).appendChild(b);}

// ===== W1 validateLayout() ============================================
function validateLayout(L, wallH){
  const wh=wallH||WH;
  const errors=[],warnings=[];
  const allWalls=[...(L.layout.exterior||[]),...(L.layout.partitions||[])];
  const allOpCodes=new Set();
  allWalls.forEach(w=>(w.op||[]).forEach(o=>allOpCodes.add(o.code)));
  allWalls.forEach((w,wi)=>{
    const ax=w.a[0],ay=w.a[1],bx=w.b[0],by=w.b[1];
    const len=Math.hypot(bx-ax,by-ay);
    const ops=(w.op||[]).slice().sort((m,n)=>m.s-n.s);
    ops.forEach((o,oi)=>{
      if(o.s<-0.001||o.e>len+0.001||o.s>=o.e)
        errors.push(`R1 牆${wi} ${o.code} 區間[${o.s},${o.e}] 超出牆長${len.toFixed(3)}`);
      if(o.type==='window'){
        if((o.sill||0)<-0.001||o.top>wh+0.001)
          errors.push(`R2 ${o.code} sill=${o.sill} top=${o.top} 超出牆高${wh}`);
      }
      if(oi>0&&o.s<ops[oi-1].e-0.001)
        errors.push(`R3 牆${wi} ${o.code} 與 ${ops[oi-1].code} 重疊`);
    });
    const ux=(bx-ax)/len,uy=(by-ay)/len;
    const t=w.t||0.16;
    (L.layout.columns||[]).forEach(c=>{
      // p is CENTER of column (confirmed by 2D SVG: rect at p[0]-s[0]/2, p[1]-s[1]/2)
      const cx=c.p[0],cy=c.p[1],hw=c.s[0]/2,hd=c.s[1]/2;
      const corners=[[cx-hw,cy-hd],[cx+hw,cy-hd],[cx+hw,cy+hd],[cx-hw,cy+hd]];
      const projs=corners.map(([px,py])=>(px-ax)*ux+(py-ay)*uy);
      const cs=Math.min(...projs),ce=Math.max(...projs);
      const perp=Math.abs((cx-ax)*(-uy)+(cy-ay)*ux);
      const halfColPerp=Math.max(hw,hd);
      if(perp<t/2+halfColPerp+0.05&&cs<len+0.001&&ce>-0.001){
        ops.forEach(o=>{
          if(o.s<ce+0.001&&o.e>cs-0.001)
            errors.push(`R4 柱@[${c.p}] 與 ${o.code} 衝突（禁區間[${cs.toFixed(2)},${ce.toFixed(2)}]）`);
        });
      }
    });
  });
  if(Array.isArray(L.layout.beams)&&L.layout.beams.length>0&&typeof L.layout.beams[0]==='object'){
    L.layout.beams.forEach(beam=>{
      const beamBottom=wh-beam.h;
      const bx1=beam.a[0],by1=beam.a[1],bx2=beam.b[0],by2=beam.b[1],bw=beam.w;
      // 樑 footprint（軸對齊矩形，a→b 加寬 w/2）
      const beam_x1=Math.min(bx1,bx2)-bw/2,beam_x2=Math.max(bx1,bx2)+bw/2;
      const beam_y1=Math.min(by1,by2)-bw/2,beam_y2=Math.max(by1,by2)+bw/2;
      allWalls.forEach(wall=>{
        if(!Array.isArray(wall.op)||!wall.op.length) return;
        const wx1=wall.a[0],wy1=wall.a[1],wx2=wall.b[0],wy2=wall.b[1];
        const wt=wall.t||0.16;
        const wallLength=Math.hypot(wx2-wx1,wy2-wy1);
        if(wallLength===0) return;
        const unitX=(wx2-wx1)/wallLength,unitY=(wy2-wy1)/wallLength;
        wall.op.forEach(op=>{
          const opS=op.s||0,opE=op.e||0;
          if(opS>=opE) return;
          let opX1=wx1+unitX*opS,opX2=wx1+unitX*opE;
          let opY1=wy1+unitY*opS,opY2=wy1+unitY*opE;
          if(opX1>opX2)[opX1,opX2]=[opX2,opX1];
          if(opY1>opY2)[opY1,opY2]=[opY2,opY1];
          // 加寬 t/2 垂直於牆軸方向
          const halfWt=wt/2;
          if(Math.abs(unitX)>Math.abs(unitY)){opY1-=halfWt;opY2+=halfWt;}
          else{opX1-=halfWt;opX2+=halfWt;}
          const opTop=op.top||(op.type==='door'?2.1:2.05);
          if(beamBottom>=opTop-0.001) return;
          // 平面重疊（樑在開口正上方但不侵入＝正常窗上樑，不警告）
          const overlapX=Math.max(0,Math.min(beam_x2,opX2)-Math.max(beam_x1,opX1));
          const overlapY=Math.max(0,Math.min(beam_y2,opY2)-Math.max(beam_y1,opY1));
          if(overlapX>0.02&&overlapY>0.02)
            warnings.push(`R5 樑${beam.code} 底${beamBottom.toFixed(2)}m 侵入 ${op.code} 頂${opTop}m（平面交疊）`);
        });
      });
    });
  }
  (L.layout.rooms||[]).forEach(r=>{
    (r.win||[]).forEach(code=>{
      if(!allOpCodes.has(code))
        errors.push(`R6 房間${r.id} 引用窗 ${code} 不存在`);
    });
    const [x1,y1,x2,y2]=r.bbox,ex=0.3;
    const hasWall=allWalls.some(w=>
      (w.a[0]>=x1-ex&&w.a[0]<=x2+ex&&w.a[1]>=y1-ex&&w.a[1]<=y2+ex)||
      (w.b[0]>=x1-ex&&w.b[0]<=x2+ex&&w.b[1]>=y1-ex&&w.b[1]<=y2+ex));
    if(!hasWall) errors.push(`R6 房間${r.id}(${r.name}) 找不到相鄰牆端點`);
  });
  return {errors,warnings};
}
function showValidationWarning(result){

    const warnText='🟡'+warns.length+' 提醒';
    pillText= pillText? pillText+' · '+warnText : warnText;
  }
  pill.innerHTML=pillText;
  let listHTML='';
  errs.forEach(err=>{ listHTML+='<div style="color:#c0392b">· '+err+'</div>'; });
  warns.forEach(warn=>{ listHTML+='<div style="color:#9a7b00">· '+warn+'</div>'; });
  listEl.innerHTML=listHTML;
  listEl.style.display=expanded?'block':'none';
}
// ===== end W1 =========================================================

function init(){
  try{ const pj=L.project;
    document.getElementById('hmeta').textContent=`${pj.name} · ${pj.rooms_label} · ${pj.area_ping}坪(${pj.area_m2}m²) · ${pj.site}`;

// 截圖模式:?shot=<roomId>&style=<schemeId> → 隱藏所有 UI,套用風格,飛到該房,給渲染管線抓乾淨 hero 圖

// ============ 2D SVG 平面圖 ============
const SC=70, PADX=100, PADY=30; // m -> px
function mx(x){return PADX + x*SC;}
function my(y){return PADY + (L.project.envelope.d - y)*SC;} // flip Y (north up)
function build2D(){
  const W=L.project.envelope.w, D=L.project.envelope.d;
  const svg=document.getElementById('plan2d');
  svg.setAttribute('viewBox',`0 0 ${W*SC+PADX*2} ${D*SC+PADY*2}`);
  let s='';
  // 房間填色塊(可點)
  L.layout.rooms.forEach(r=>{
    const[x0,y0,x1,y1]=r.bbox;
    s+=`<rect class="rm" data-room="${r.id}" x="${mx(x0)}" y="${my(y1)}" width="${(x1-x0)*SC}" height="${(y1-y0)*SC}" fill="#efe6d6" stroke="#d9cdb6"/>`;
    s+=`<text x="${mx((x0+x1)/2)}" y="${my((y0+y1)/2)}" font-size="15" fill="#8a7d66" text-anchor="middle" font-weight="600" pointer-events="none">${r.name}</text>`;
    s+=`<text x="${mx((x0+x1)/2)}" y="${my((y0+y1)/2)+16}" font-size="11" fill="#aa9d86" text-anchor="middle" pointer-events="none">${r.ping}坪</text>`;
  });
  // 牆
  function wallLine(seg,wd){const[a,b]=[seg.a,seg.b];s+=`<line x1="${mx(a[0])}" y1="${my(a[1])}" x2="${mx(b[0])}" y2="${my(b[1])}" stroke="#5b5346" stroke-width="${wd}" stroke-linecap="square"/>`;}
  // 外牆:也是 .pwall(key='e'+i)，拆牆模式可點拆/還原(FR-003)
  L.layout.exterior.forEach((w,i)=>{const a=w.a,b=w.b;
    s+=`<line class="pwall ext fixed" data-pi="e${i}" x1="${mx(a[0])}" y1="${my(a[1])}" x2="${mx(b[0])}" y2="${my(b[1])}" stroke="#5b5346" stroke-width="7" stroke-linecap="square"/>`;});
  // 輕隔間 vs 結構/紅線牆:可點選編輯(key='p'+i)
  L.layout.partitions.forEach((w,i)=>{const a=w.a,b=w.b,fx=wallFixed(w);
    s+=`<line class="pwall ${fx?'fixed':'mov'}" data-pi="p${i}" x1="${mx(a[0])}" y1="${my(a[1])}" x2="${mx(b[0])}" y2="${my(b[1])}" stroke="${fx?'#b06b52':'#5b5346'}" stroke-width="6" stroke-linecap="round"/>`;});
  // 柱
  L.layout.columns.forEach(c=>{s+=`<rect x="${mx(c.p[0]-c.s[0]/2)}" y="${my(c.p[1]+c.s[1]/2)}" width="${c.s[0]*SC}" height="${c.s[1]*SC}" fill="#9a9a9a"/>`;});
  // W4: 樑 2D 虛線（疑點位，半透明）
  (L.layout.beams||[]).filter(b=>typeof b==='object').forEach(b=>{
    s+=`<line x1="${mx(b.a[0]).toFixed(1)}" y1="${my(b.a[1]).toFixed(1)}" x2="${mx(b.b[0]).toFixed(1)}" y2="${my(b.b[1]).toFixed(1)}" stroke="#7a7068" stroke-width="${Math.round(b.w*SC)}" stroke-dasharray="10,5" opacity="0.4"/>`;
  });
  // 窗(藍) + 門(開口示意) + W3 開門弧
  L.layout.exterior.concat(L.layout.partitions).forEach(w=>{
    (w.op||[]).forEach(o=>{
      const[a,b]=[w.a,w.b];const len=Math.hypot(b[0]-a[0],b[1]-a[1]);const ux=(b[0]-a[0])/len,uy=(b[1]-a[1])/len;
      const sx=a[0]+ux*o.s,sy=a[1]+uy*o.s,ex=a[0]+ux*o.e,ey=a[1]+uy*o.e;
      const col=o.type==='window'?'#3f8fb8':'#cbb89a';const wd=o.type==='window'?5:6;
      s+=`<line x1="${mx(sx)}" y1="${my(sy)}" x2="${mx(ex)}" y2="${my(ey)}" stroke="${col}" stroke-width="${wd}"/>`;
      // W3: 開門弧（有 dir 的門）
      if(o.type==='door'&&o.dir){
        const r=o.e-o.s; // 門寬 = 弧半徑
        const bit0=o.dir[0]; // 0=鉸鏈在 s 端, 1=鉸鏈在 e 端
        const hx2=bit0?ex:sx,hy2=bit0?ey:sy; // 鉸鏈點
        const fx2=bit0?sx:ex,fy2=bit0?sy:ey; // 自由端
        // 垂直方向（左旋90° = 牆左側 = 室內側 for bit1=0; 右旋 for bit1=1）
        const nx2=o.dir[1]?uy:-uy,ny2=o.dir[1]?-ux:ux;
        const px2=hx2+(nx2*r),py2=hy2+(ny2*r);
        const sf=o.dir[1]?0:1; // SVG sweep flag
        s+=`<path d="M${mx(fx2).toFixed(1)},${my(fy2).toFixed(1)} A${(r*SC).toFixed(1)},${(r*SC).toFixed(1)} 0 0,${sf} ${mx(px2).toFixed(1)},${my(py2).toFixed(1)}" stroke="#c9a860" fill="none" stroke-width="1.5" opacity="0.7"/>`;
        s+=`<line x1="${mx(hx2).toFixed(1)}" y1="${my(hy2).toFixed(1)}" x2="${mx(px2).toFixed(1)}" y2="${my(py2).toFixed(1)}" stroke="#c9a860" stroke-width="1.5" opacity="0.7"/>`;
      }
      // W3: D5 拉門符號（虛線）
      if(o.type==='door'&&o.sliding){
        const mid2=0.55; // 示意已滑開的比例
        s+=`<line x1="${mx(sx+ux*0.05).toFixed(1)}" y1="${my(sy+uy*0.05).toFixed(1)}" x2="${mx(sx+ux*(o.e-o.s)*mid2).toFixed(1)}" y2="${my(sy+uy*(o.e-o.s)*mid2).toFixed(1)}" stroke="#888" stroke-width="2.5" stroke-dasharray="5,4" opacity="0.8"/>`;
      }
    });
  });
  svg.innerHTML=s;
  svg.querySelectorAll('.rm').forEach(el=>el.onclick=()=>selectRoom(el.dataset.room));
  svg.querySelectorAll('.pwall').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const key=el.dataset.pi;
    if(doorMode){ // 算點擊沿牆位置 t,新增/選門
      const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const ctm=svg.getScreenCTM();
      const loc=ctm?pt.matrixTransform(ctm.inverse()):{x:ev.offsetX,y:ev.offsetY};

function computeMiters(walls){
  const adj=walls.map(()=>({da:[0,0],db:[0,0]}));
  const EPS=0.01;
  for(let i=0;i<walls.length;i++){
    const wi=walls[i];
    const lxi=wi.b[0]-wi.a[0],lyi=wi.b[1]-wi.a[1];
    const li=Math.hypot(lxi,lyi);if(li<0.001)continue;
    const uxi=lxi/li,uyi=lyi/li;
    const ti=wi.t||0.16;
    for(let j=i+1;j<walls.length;j++){
      const wj=walls[j];
      const lxj=wj.b[0]-wj.a[0],lyj=wj.b[1]-wj.a[1];
      const lj=Math.hypot(lxj,lyj);if(lj<0.001)continue;
      const uxj=lxj/lj,uyj=lyj/lj;
      const tj=wj.t||0.16;
      if(Math.abs(uxi*uxj+uyi*uyj)>0.087)continue; // not orthogonal
      for(const[ei,ej]of[['a','a'],['a','b'],['b','a'],['b','b']]){
        const pi=wi[ei],pj=wj[ej];
        if(Math.hypot(pi[0]-pj[0],pi[1]-pj[1])>=EPS)continue;
        if(ei==='a'){adj[i].da[0]-=uxi*(tj/2);adj[i].da[1]-=uyi*(tj/2);}
        else{adj[i].db[0]+=uxi*(tj/2);adj[i].db[1]+=uyi*(tj/2);}
        if(ej==='a'){adj[j].da[0]-=uxj*(ti/2);adj[j].da[1]-=uyj*(ti/2);}
        else{adj[j].db[0]+=uxj*(ti/2);adj[j].db[1]+=uyj*(ti/2);}
      }
    }
  }
  return adj;
}

// ====== 程序化貼圖:全部畫成「灰階細節」,由材質 color 上色 → 換風格自動變色,即時 3D 走動就有材質質感 ======
// repeat 一律按「實際公尺數/單元尺寸」換算,避免大牆小牆共用 repeat 造成拉伸
function _tc(){const c=document.createElement('canvas');c.width=c.height=512;return [c,c.getContext('2d')];}
function _rnd(n){return (Math.random()*2-1)*n;}
function _mk(c,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}

// ====== FR-008 PBR 牆/地材質:assets/surfaces/ 的 KTX2(albedo/normal/orm) 非同步載入,
//   成功 → 換掉程序化 CanvasTexture(掛 map+normalMap+roughnessMap);失敗 → 保留程序化(鐵則4不破圖)。
//   ORM 慣例:R=AO, G=Roughness, B=Metalness。three r128 MeshStandardMaterial 用同一張 orm
//   當 aoMap/roughnessMap/metalnessMap(各自取對應通道)。Lambert 不支援 normalMap,故牆漆材質改 Standard。
let _ktx2Loader=null,_pbrSurfaceCache={};
function _getKTX2(){
  if(_ktx2Loader)return _ktx2Loader;
  if(typeof THREE==='undefined'||!THREE.KTX2Loader||!renderer)return null;
  try{_ktx2Loader=new THREE.KTX2Loader().setTranscoderPath('vendor/basis/').detectSupport(renderer);}
  catch(e){console.warn('[PBR] KTX2Loader init fail',e&&e.message);_ktx2Loader=null;}
  return _ktx2Loader;
}
// 載入一組(albedo/normal/orm),回 Promise<{albedo,normal,orm}|null>;repeat 由呼叫端套用
function _loadSurfaceSet(name){
  if(_pbrSurfaceCache[name])return _pbrSurfaceCache[name];
  const k=_getKTX2();
  const p=new Promise((res)=>{
    if(!k){res(null);return;}
    const base='assets/surfaces/'+name+'/';
    const load=(f)=>new Promise((r)=>k.load(base+f,t=>r(t),undefined,()=>r(null)));
    Promise.all([load('albedo.ktx2'),load('normal.ktx2'),load('orm.ktx2')]).then(([al,no,or])=>{
      if(!al){res(null);return;}
      res({albedo:al,normal:no,orm:or});
    });
  });
  _pbrSurfaceCache[name]=p;return p;
}
// 把一組 PBR 貼圖套到一個 MeshStandardMaterial(保留色調 tint=白讓 albedo 原色,或保留既有 color)
function _applyPbrToMat(m,set,rx,ry,opt){
  if(!m||!set)return false;
  opt=opt||{};
  const cfg=(t,srgb)=>{if(!t)return null;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;t.encoding=srgb?THREE.sRGBEncoding:THREE.LinearEncoding;t.needsUpdate=true;return t;};
  // 關鍵:KTX2 albedo 解碼偏暗(壓縮),直接換上會把暖米牆/淺橡木地變成水泥髒色。
  // 故預設「保留既有程序化 albedo(顏色已調好)」,只疊 KTX2 normalMap(真實表面起伏)+選擇性 roughnessMap。
  // opt.swapAlbedo=true 才換 KTX2 albedo(本案不用)。
  if(opt.swapAlbedo&&set.albedo){if(m.map&&m.map.dispose)m.map.dispose();m.map=cfg(set.albedo.clone(),true);}
  if(set.normal){if(m.normalMap&&m.normalMap.dispose)m.normalMap.dispose();m.normalMap=cfg(set.normal.clone(),false);if(m.normalScale)m.normalScale.set(opt.normalScale||0.5,opt.normalScale||0.5);}
  if(set.orm&&opt.useORM){if(m.roughnessMap&&m.roughnessMap.dispose)m.roughnessMap.dispose();const o=cfg(set.orm.clone(),false);m.roughnessMap=o;if(opt.useMetal)m.metalnessMap=o;}
  if(opt.tint!=null)m.color.setHex(opt.tint);
  if(opt.roughness!=null)m.roughness=opt.roughness;
  if(opt.metalness!=null)m.metalness=opt.metalness;
  m.needsUpdate=true;return true;
}
// 進場後呼叫:地板 wood_oak_cream、牆漆 plaster_warm。只在 cream 風格套真實貼圖(其餘風格維持程序化變色)。
function loadPbrSurfaces(){
  try{
    if(!renderer||!matFloor)return;
    const env=L.project.envelope;
    // 地板(Standard):木地板貼圖,repeat 對齊房屋尺寸(貼圖約 2m tile → repeat=尺寸/2)
    _loadSurfaceSet('wood_oak_cream').then(set=>{
      if(!set)return;
      if(scheme&&scheme!=='cream')return; // 換到非 cream 後不覆蓋程序化
      // 淺橡木地板:保留程序化木紋色(已調好),疊 KTX2 法線(真實板面起伏)+ orm 粗糙度變化
      _applyPbrToMat(matFloor,set,Math.max(1,env.w/1.8),Math.max(1,env.d/1.8),{metalness:0,normalScale:0.5,useORM:true});
    });
    // 牆漆(Standard):plaster_warm。matWall/matExt/matLint + _wallMatCache 內的 paint 牆段。
    _loadSurfaceSet('plaster_warm').then(set=>{
      if(!set)return;
      if(scheme&&scheme!=='cream')return;
      // S2 暖米牆漆:保留程序化暖白 albedo,疊 KTX2 法線(塗料起伏)+ 吃回 orm.G roughnessMap(原本硬寫 0.95 死平→紙板感)。乳膠漆刷痕/補土的半光不均回來。
      const wopt={metalness:0,normalScale:0.7,useORM:true,useMetal:false};  // 移除硬寫 roughness:0.95 改吃 orm.G;normalScale 0.42→0.7
      const wallTargets=[matWall,matExt,matLint].filter(Boolean);
      wallTargets.forEach(m=>_applyPbrToMat(m,set,3,4,wopt));
      Object.keys(_wallMatCache).forEach(k=>{const m=_wallMatCache[k];if(m&&m.userData&&m.userData.kind==='paint')_applyPbrToMat(m,set,m.userData.rx||3,m.userData.ry||4,wopt);});
    });
    // S3 濕區磁磚(全場最假面):資產 tile_wet_warm KTX2 已存在卻沒接線。套到濕區地坪 wetFloorMats(保程序化色避免 albedo 太暗),吃 normal(縫凹陷)+ orm(釉面粗糙度對比)。
    _loadSurfaceSet('tile_wet_warm').then(set=>{
      if(!set)return;
      const topt={metalness:0,normalScale:0.8,useORM:true,useMetal:false};
      (wetFloorMats||[]).forEach(m=>{if(m&&m.userData)_applyPbrToMat(m,set,m.userData.rx||3,m.userData.ry||3,topt);});
    });
  }catch(e){console.warn('[PBR] loadPbrSurfaces fail(非致命)',e&&e.message);}
}

function loadBathFixture(url,lx,ly,rotY,yOff){
  if(typeof THREE==='undefined'||!THREE.GLTFLoader)return;
  const myGen=_fixtureGen; // capture 當前世代;rebuildFixtures 已先 ++,故同步鏈內呼叫拿到的是新世代
  const loader=new THREE.GLTFLoader();

    if(window.MeshoptDecoder)loader.setMeshoptDecoder(window.MeshoptDecoder);

function wallFixed(w){
  // 以 layout.json 的 removable 旗標為準（已對官方客變原則 + Gemini Pro 覆核）
  if(typeof w.removable==='boolean')return w.removable===false;
  // 後備：無旗標時用廚/浴/衛 邊界啟發式
  const fr=(L.layout.rooms||[]).filter(r=>/廚|浴|衛/.test(r.use||'')||/廚|浴|衛/.test(r.name||''));
  const ax=w.a[0],ay=w.a[1],bx=w.b[0],by=w.b[1];
  const horiz=Math.abs(ay-by)<1e-6, vert=Math.abs(ax-bx)<1e-6;
  for(const r of fr){const[x0,y0,x1,y1]=r.bbox;
    if(horiz&&(Math.abs(ay-y0)<.07||Math.abs(ay-y1)<.07)){const lo=Math.max(Math.min(ax,bx),x0),hi=Math.min(Math.max(ax,bx),x1);if(hi-lo>.3)return true;}
    if(vert&&(Math.abs(ax-x0)<.07||Math.abs(ax-x1)<.07)){const lo=Math.max(Math.min(ay,by),y0),hi=Math.min(Math.max(ay,by),y1);if(hi-lo>.3)return true;}
  }
  return false;
}

function handleDoorClick(key,t){
  const w=_wallByKey2(key); if(!w)return;

  const hit=w.op.findIndex(o=>(o.type==='door'||o.type==='sliding_door'||o.sliding)&&t>=o.s-0.1&&t<=o.e+0.1);
  if(hit>=0){ selDoor={key,opi:hit}; showDoorTools(); return; }

  const len=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]); const half=0.45;

  if(clash){ setPill('這裡放不下門(與既有開口/牆邊重疊),換個位置'); return; }
  w.op.push({s:+s.toFixed(3),e:+e.toFixed(3),type:'door',custom:true,dir:[0,0]}); // dir→與其他門一致(鉸鏈、可開關)
  assignDoorIds(); // 給新門穩定 did(碰撞/開關用)

  rebuildWallByKey(key); syncContactAO(); showDoorTools();

          const pm=new THREE.MeshStandardMaterial({color:0xa88c66,roughness:.6,clippingPlanes:[clip]});
          [0.5,1.35].forEach(yy=>{const pn=new THREE.Mesh(new THREE.BoxGeometry(lw-0.2,0.6,0.05),pm);pn.position.set(0,yy,0.028);grp.add(pn);});
          const hm=new THREE.MeshStandardMaterial({color:0x9a9a9a,metalness:.85,roughness:.3,clippingPlanes:[clip]});
          const hd=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.12,12),hm);hd.rotation.z=Math.PI/2;hd.position.set(lw/2-0.13,1.02,0.06);grp.add(hd);

let cameraTween=null;
function cameraEase(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function setCameraImmediate(pos,target){cam.position.copy(pos);orbit.target.copy(target);orbit.update();}
function flyCameraTo(pos,target,label){
  if(!cam||!orbit)return;
  if(label)setPill(label);
  if(cameraTween)cameraTween.cancelled=true;
  if(document.body.classList.contains('shotmode')){setCameraImmediate(pos,target);return;}
  const startPos=cam.position.clone(),startTarget=orbit.target.clone(),token={cancelled:false};
  cameraTween=token;
  const t0=performance.now(),dur=960;
  function step(now){
    if(token.cancelled)return;
    const t=Math.min(1,(now-t0)/dur),k=cameraEase(t);
    cam.position.lerpVectors(startPos,pos,k);
    orbit.target.lerpVectors(startTarget,target,k);
    orbit.update();
    if(t<1)requestAnimationFrame(step);else if(cameraTween===token)cameraTween=null;
  }
  requestAnimationFrame(step);
}

// FR-001 房內 hero 相機:站姿視角看「家具正面 3/4」。
// 家具朝向約定(程序化 + GLB 一致):沙發/床/餐桌「正面朝 -Y(較小 layoutY)」,背靠 +Y 牆。
// 算法:找本房主家具 → 站在它「正面側(-Y)」、再偏一個角給 3/4 立體感,眼高 ~1.55m 站姿,
//       視線水平略下看家具中段(坐墊/床面)。相機夾在房內安全邊不穿牆。
function heroCamForRoom(r){
  const e=L.project.envelope,cx=e.w/2,cy=e.d/2;
  const[x0,y0,x1,y1]=r.bbox;
  const w=x1-x0,d=y1-y0;             // layout 房間寬(X)/深(Y)
  const mx=(x0+x1)/2,my=(y0+y1)/2;   // 房間中心(layout)
  // 站姿眼高:成人站立眼高約 1.5–1.6m;頂已掀,視線接近水平略微下俯。
  const eye=1.55;
  // 廚房:特例。固定件(吊櫃/油煙機)在後牆 layoutY~0.3 且偏高,主家具相機俯角會切掉。
  // → 站 +Y 側退到牆邊,眼高站姿,看向後牆 counter+吊櫃中段(lookY 拉高)框進上下櫃體。
  // 客廳:特例。沙發(1.7,3.25)與對面電視櫃+電視(1.7,4.8,牆在 y≈5.4)要「成組入鏡」。
  // → 相機站沙發前方(-Y 側,靠前緣)、退遠、偏一角給 3/4,眼高站姿略升,
  //   視線朝 +Y 看向沙發與電視牆「之間」,兩者都框進畫面。
  if(r.id==='living'){
    const sofa=(L.furniture||[]).find(f=>f.room==='living'&&f.type==='sofa');
    const sx=sofa?sofa.x:1.7, sy=sofa?sofa.y:3.25;
    // 沙發(y≈3.25)在前、電視牆(y≈5.4)在後 → 相機退到沙發前緣外(y0 牆角),
    // 站高一點俯瞰,偏一側給 3/4,視線朝 +Y 看向沙發與電視「之間」(y≈4.0),
    // 兩者一前一後同時入鏡:沙發在前景下半,電視掛牆在中後。
    // 站前角、眼高(站姿 ~1.55m 不再鳥瞰),3/4 斜角看沙發側前+電視牆,不再俯框沙發背。
    const camX=Math.min(x1-0.3,Math.max(x0+0.3,sx+1.55));    // 偏右斜角(靠側牆給 3/4)
    const camY=Math.max(y0+0.3,sy-1.7);                      // 退到沙發前緣外牆角
    const pos=new THREE.Vector3(camX-cx,1.55,cy-camY);        // 眼高站姿
    const look=new THREE.Vector3((sx*0.45+camX*0.55)-cx,1.05,cy-4.25);  // 看沙發與電視牆之間,lookY 抬高框進掛牆電視
    return {pos,look};

  if(r.id==='kitchen'){
    // 僅 ~2m 深且後牆有上下櫃 → 相機站房內最 +Y 角落、偏一側(3/4),眼高站姿,
    // 視線略上抬(lookY~1.25)框住「下櫃 counter + 上方吊櫃/油煙機」整面牆。
    // 站房內 +Y 左角,看向「爐具+油煙機」烹飪牆(x≈4.6),3/4 斜角框住下櫃 counter+爐具+上方油煙機。
    const camX=Math.min(x1-0.45,Math.max(x0+0.45,3.0));   // 偏左給斜角,看向右側爐區
    const camY=y1-0.45;                                    // 房內最 +Y 角(離後牆 ~1.5m)
    const pos=new THREE.Vector3(camX-cx,1.5,cy-camY);
    const look=new THREE.Vector3(4.55-cx,1.05,cy-0.45);   // 看爐具/油煙機牆,稍降框進檯面爐盤
    return {pos,look};
  }

  const prio={sofa:5,bed:4,table:3,counter:2};
  let main=null,mainScore=-1;
  (L.furniture||[]).forEach((f,fi)=>{if(f.room!==r.id)return;const ov=(furnOverride&&furnOverride[fi])||f;
    const s=prio[f.type]||1;if(s>mainScore){mainScore=s;main={type:f.type,x:ov.x,y:ov.y,w:f.w,d:f.d};}});
  // 衛浴:無 layout 家具,用固定件估點當主目標(洗手台/馬桶在房內側)。
  if(r.id==='bath1'||r.id==='bath2'){
    // 衛浴主目標=立體洗手盆(basin),覆寫 wc(馬桶):bath1 靠上牆右(x1-0.42,y1-0.30)、
    // bath2 靠下牆右(x1-0.6,y0+0.28)。看 basin 才看得到新版立體盆;basin 偏高(~1m)。
    const bx=r.id==='bath1'?x1-0.42:x1-0.6, byy=r.id==='bath1'?y1-0.30:y0+0.28;
    main={type:'basin',x:bx,y:byy,w:0.62,d:0.52};
  }
  // 退牆安全邊:相機保證在房內不穿牆。
  const clampX=v=>Math.min(x1-0.35,Math.max(x0+0.35,v));
  const clampY=v=>Math.min(y1-0.35,Math.max(y0+0.35,v));
  let camX,camY,lookX,lookY,lookZ;
  if(main){
    // 家具正面朝 -Y;若家具貼下牆(y 接近 y0,如廚具 counter),正面其實朝 +Y(房內)。
    // 判斷:家具中心在房間下半 → 正面朝 +Y;在上半 → 正面朝 -Y。沙發/床多半靠上牆→-Y。
    const faceNegY = (main.y - my) >= -0.05;   // 家具偏房間中上 → 正面朝 -Y
    const frontSign = faceNegY ? -1 : 1;        // 正面所在側(相機要站這側)
    // 相機站在家具正面前方一段距離(看得到正面+坐墊),距離給夠框飽滿。
    const frontDist = Math.max(1.5, Math.min(d*0.62, main.d/2 + 1.9));
    camY = clampY(main.y + frontSign*frontDist);
    // 沿 X 偏一個角(3/4 視角),偏向房間較空的一側,量約家具半寬+0.7。
    const sideSign = (main.x - mx) <= 0 ? 1 : -1;  // 家具偏左→相機偏右,反之
    camX = clampX(main.x + sideSign*(main.w/2 + 0.7));
    // 看向家具中段(坐墊/床面高度 ~0.55m),略低於眼高 → 視線略向下。
    // 洗手盆較高(立柱式 ~1m)→ lookY 拉高框住盆體+龍頭,不切頂。
    lookX = main.x; lookY = (main.type==='basin')?0.85:0.55; lookZ = main.y;
  }else{
    // 無家具退回:站房間一角看中心,站姿微俯。
    camX=clampX(mx - (w/2)*0.7); camY=clampY(my - (d/2)*0.7);
    lookX=mx; lookY=0.7; lookZ=my;
  }
  // 世界座標換算(與既有 view 公式一致):worldX=layoutX-cx, worldZ=cy-layoutY
  const pos=new THREE.Vector3(camX-cx, eye, cy-camY);
  const look=new THREE.Vector3(lookX-cx, lookY, cy-lookZ);
  return {pos,look};
}

// ============ 風格(套件驅動:style-packs.js;一套 = 牆漆+濕區磚+地板+天花+門框窗簾+家具成組) ============
function applyScheme(id){
  const pk=getPack(id);if(!pk)return;
  scheme=pk.id;PACK=pk;
  applyPackLighting(pk);
  const wl=pk.wall||{},ww=pk.wetWall||{},fl=pk.floor||{},wf=pk.wetFloor||{};
  const wtex=wl.tex||'paint'; // 一般牆飾面:'paint' 乳膠漆 / 'concrete' 水泥粉光
  // 一般牆/外牆/門楣:乳膠漆色(工業=水泥粉光貼圖,換套件時連貼圖一起換)
  [matWall,matExt,matLint].forEach(m=>{if(!m)return;m.color.setHex(hx(wl.paint||'#f3ece1'));m.roughness=wl.roughness!=null?wl.roughness:.95;
    m.userData=m.userData||{};if(m.userData.wtex!==wtex){m.userData.wtex=wtex;if(m.map)m.map.dispose();m.map=(wtex==='concrete')?concreteTex(3,4):plasterTex(3,4);m.needsUpdate=true;}});
  // 牆段快取材質就地更新:漆 → 變色(連水泥/乳膠貼圖);磚 → 變色+粗糙度,磚款(square/subway)不同時連貼圖一起換
  Object.keys(_wallMatCache).forEach(k=>{
    const m=_wallMatCache[k],u=m.userData;
    if(u.kind==='paint'){m.color.setHex(hx(wl.paint||'#f3ece1'));m.roughness=wl.roughness!=null?wl.roughness:.95;
      if(u.wtex!==wtex){u.wtex=wtex;if(m.map)m.map.dispose();m.map=(wtex==='concrete')?concreteTex(u.rx,u.ry):plasterTex(u.rx,u.ry);m.needsUpdate=true;}}
    else{
      m.color.setHex(hx(ww.color||'#f3f3ee'));m.roughness=ww.roughness!=null?ww.roughness:.30;
      const pat=ww.pattern||'square';
      if(u.pattern!==pat){if(m.map)m.map.dispose();m.map=wallTileTex(u.rx,u.ry,pat);u.pattern=pat;m.needsUpdate=true;}
    }
  });
  if(matSill)matSill.color.setHex(hx(pk.sill||pk.accent||'#e7c9a3'));
  // 客廳主牆飾面:平塗跳色 / 直立原木格柵(slat) / 紅磚牆(brick) —— 換套件時這面牆「材質」整個換
  if(matAccent){
    const am=pk.accentMat||{kind:'paint',color:pk.accent||'#e7c9a3'};
    const AW=3.4,AH=WH-0.08;
    matAccent.userData=matAccent.userData||{};
    if(matAccent.map)matAccent.map.dispose();
    if(am.kind==='slat'){
      matAccent.map=slatTex(Math.max(1,AW/0.8),1,am.color,am.c2);
      matAccent.color.setHex(0xffffff);matAccent.roughness=am.roughness!=null?am.roughness:0.62;matAccent.metalness=0;
    }else if(am.kind==='brick'){
      matAccent.map=brickTex(Math.max(1,AW/0.86),Math.max(1,AH/0.56),am.color,am.c2);
      matAccent.color.setHex(0xffffff);matAccent.roughness=am.roughness!=null?am.roughness:0.88;matAccent.metalness=0;
    }else{
      matAccent.map=plasterTex(3,3);
      matAccent.color.setHex(hx(am.color||pk.accent||'#e7c9a3'));matAccent.roughness=am.roughness!=null?am.roughness:0.9;matAccent.metalness=0;
    }
    matAccent.userData.akind=am.kind;matAccent.needsUpdate=true;
  }
  if(matDoor)matDoor.color.setHex(hx(pk.door||'#b89a72'));
  if(matFrame)matFrame.color.setHex(hx(pk.frame||'#6b5f54'));
  if(matCeil)matCeil.color.setHex(hx(pk.ceiling||'#f7f5f0'));
  curtainMats.forEach(m=>m.color.setHex(hx(pk.curtain||'#eae0cf')));
  // 濕區/陽台 石英磚地
  wetFloorMats.forEach(m=>{m.color.setHex(hx(wf.color||'#d8d5cc'));m.roughness=wf.roughness!=null?wf.roughness:.55;});
  if(balconyFloorMat)balconyFloorMat.color.setHex(hx(wf.color||'#cfcabf'));
  // 乾區地板:kind=wood/marble 連貼圖一起換,不只平塗顏色
  const _ev=L.project.envelope;
  if(matFloor){
    if(matFloor.map)matFloor.map.dispose();
    matFloor.map=(fl.kind==='marble')?marbleTex(_ev.w/1.6,_ev.d/1.6):woodFloorTex(_ev.w/0.64,_ev.d/2.4);
    matFloor.color.setHex(hx(fl.color||'#cbb08a'));
    matFloor.roughness=fl.roughness!=null?fl.roughness:.5;matFloor.metalness=fl.metalness||0;
    matFloor.envMapIntensity=fl.envMapIntensity!=null?fl.envMapIntensity:1.0;matFloor.needsUpdate=true;
  }
  // 家具:整組重建(配色+款式跟套件,位置/顯示狀態保留)
  if(_furnPackId!==pk.id){_furnPackId=pk.id;try{rebuildFurniture();}catch(e){console.error('furn',e);}try{rebuildFixtures();}catch(e){console.error('fixtures',e);}}
  document.querySelectorAll('#schemes .chip,#mobile-schemes .chip').forEach(c=>c.classList.toggle('on',c.dataset.s===pk.id));
  // FR-008:回到 cream 時重掛 KTX2 PBR(剛被程序化貼圖覆蓋);其餘風格維持程序化變色
  if(pk.id==='cream')try{loadPbrSurfaces();}catch(e){}
  refreshPhoto(); // 樣品屋照片開著時,換風格同步換圖
}

function applyPackLighting(pk){
  const l=(pk&&pk.lighting)||{};
  // W1 陰影條根治:此處 fallback 才是「生效值」(覆蓋 constructor)。6/10 只改 constructor 故無效。
  // 降主光 1.62→0.95(硬陽光條淡化)、提半球補光 0.28→0.60 + ambient 0.07→0.15(維持亮度,立體感改由柔和補光承擔)、曝光 0.92→0.96。
  if(renderer)renderer.toneMappingExposure=l.exposure!=null?l.exposure:0.96;
  if(ambientLight)ambientLight.intensity=l.ambient!=null?l.ambient:0.15;
  if(hemiLight)hemiLight.intensity=l.hemisphere!=null?l.hemisphere:0.60;
  if(sunLight)sunLight.intensity=l.sun!=null?l.sun:0.95;
  const ps=l.pointScale!=null?l.pointScale:1.0;
  accentLights.forEach(pl=>{pl.intensity=(pl.userData.baseIntensity||pl.intensity||0)*ps;});
}

function bindDrawerHandle(){
  const h=document.getElementById('drawerhandle'),r=document.getElementById('right');
  if(!h||!r||h.dataset.bound)return;
  h.dataset.bound='1';
  let sy=0,lastTouch=0;
  const toggle=()=>{setDrawerState(r.classList.contains('drawer-full')?'half':'full');setActiveBottomNav('ai');};
  h.onclick=()=>{if(Date.now()-lastTouch<450)return;if(matchMedia('(max-width:768px)').matches)toggle();};
  h.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  h.addEventListener('touchend',e=>{
    lastTouch=Date.now();
    const dy=e.changedTouches[0].clientY-sy;
    if(dy<-28)setDrawerState('full');
    else if(dy>28)setDrawerState('half');

  },{passive:true});
}

const _PR=0.20; // 玩家碰撞半徑(m)
// 點(layout 座標)是否撞到某面牆——門洞可穿越(不擋)，已拆的牆不擋
function _hitWall(lx,ly,w,thick){
  const ax=w.a[0],ay=w.a[1],bx=w.b[0],by=w.b[1];
  const len=Math.hypot(bx-ax,by-ay);if(len<1e-6)return false;
  const ux=(bx-ax)/len,uy=(by-ay)/len;
  const t=(lx-ax)*ux+(ly-ay)*uy;                 // 沿牆投影(m, 從 a)
  const perp=Math.abs((lx-ax)*(-uy)+(ly-ay)*ux); // 垂直距離
  if(perp>thick/2+_PR)return false;
  if(t<-_PR||t>len+_PR)return false;
  // 開口判定:窗→照舊擋(實牆);拉門/無鉸鏈門洞→可穿越;鉸鏈門→開著才可穿越,關著擋路(Rain:關門還能走過去)
  for(const o of (w.op||[])){
    const isDoor=(o.type==='door'||o.type==='sliding_door'||o.sliding);
    if(isDoor&&t>o.s+0.05&&t<o.e-0.05){
      if(o.dir&&!o.sliding) return doorOpen[o.did]?false:true; // 鉸鏈門:關=擋,開=通
      return false;                                            // 拉門/門洞:通行
    }
  }
  return true;
}
function _blockedLayout(lx,ly){
  for(let i=0;i<L.layout.exterior.length;i++){const w=L.layout.exterior[i];if(!demolishedWalls.has('e'+i)&&_hitWall(lx,ly,w,w.t||0.16))return true;}
  for(let i=0;i<L.layout.partitions.length;i++){const w=L.layout.partitions[i];if(!demolishedWalls.has('p'+i)&&_hitWall(lx,ly,w,0.12))return true;}
  return false;
}
function _tryMovePlayer(dx,dz){ // world Δ；逐軸滑牆 + 卡住可脫困
  const e=L.project.envelope,cx=e.w/2,cy=e.d/2;
  const stuck=_blockedLayout(playerPos.x+cx, cy-playerPos.z); // 已卡牆 → 任何移動都放行(脫困)
  let nx=playerPos.x+dx;
  if(stuck||!_blockedLayout(nx+cx, cy-playerPos.z)) playerPos.x=Math.max(-cx+.25,Math.min(cx-.25,nx));

// ---- 工具 ----
function snap5cm(v){return Math.round(v/0.05)*0.05;}

// 旋轉感知 footprint：±90° 家具(床/浴缸等)在平面投影要交換 w/d，碰撞/吸附/2D rect 才不錯位。
function _furnFootprint(f){
  const r=(((f.rotY||0)%180)+180)%180; // 0..179
  return (r>45&&r<135)?{hw:f.d/2,hd:f.w/2}:{hw:f.w/2,hd:f.d/2};
}

// ---- 碰撞偵測 (JS port of check_furniture.py，擴充家具↔家具) ----
function _wallAABB(w,t){
  const ax=w.a[0],ay=w.a[1],bx=w.b[0],by=w.b[1],ht=(t||0.16)/2;
  if(Math.abs(ax-bx)<0.01) return {x1:ax-ht,y1:Math.min(ay,by),x2:ax+ht,y2:Math.max(ay,by)};
  return {x1:Math.min(ax,bx),y1:ay-ht,x2:Math.max(ax,bx),y2:ay+ht};
}
function _activeWalls(){
  const ext=L.layout.exterior.map(w=>({w,t:w.t||0.16}));
  const par=L.layout.partitions.map((w,i)=>({w,t:0.12,pi:i}));
  return [...ext,...par].filter(o=>o.pi==null||!demolishedWalls.has('p'+o.pi));
}
function checkFurnCollision(fi,nx,ny){
  const f=L.furniture[fi],fp=_furnFootprint(f);
  const fx1=nx-fp.hw,fy1=ny-fp.hd,fx2=nx+fp.hw,fy2=ny+fp.hd;
  const EPS=0.02;
  // 1) 牆碰撞(外牆+未拆隔間)
  for(const{w,t} of _activeWalls()){
    const a=_wallAABB(w,t);
    const ox=Math.min(a.x2,fx2)-Math.max(a.x1,fx1);
    const oy=Math.min(a.y2,fy2)-Math.max(a.y1,fy1);
    if(ox>EPS&&oy>EPS) return true;
  }
  // 2) 家具↔家具碰撞(隱藏的不擋)
  for(let j=0;j<L.furniture.length;j++){
    if(j===fi||!isFurnitureVisibleIndex(j)) continue;
    const of=L.furniture[j],oov=furnOverride[j]||of,ofp=_furnFootprint(of);
    const ox=Math.min(oov.x+ofp.hw,fx2)-Math.max(oov.x-ofp.hw,fx1);
    const oy=Math.min(oov.y+ofp.hd,fy2)-Math.max(oov.y-ofp.hd,fy1);
    if(ox>EPS&&oy>EPS) return true;
  }
  return false;
}
// ---- 牆面吸附：拖近牆面 SNAP 內自動貼齊(blueprint3d boundMove 風，X/Y 各自獨立→可貼角) ----
function snapToWalls(fi,nx,ny){
  const f=L.furniture[fi],fp=_furnFootprint(f),SNAP=0.20;
  let sx=nx,sy=ny,bestDX=SNAP,bestDY=SNAP;
  for(const{w,t} of _activeWalls()){
    const a=_wallAABB(w,t);
    // X 吸附：需 Y 向有重疊(牆確實擋在家具側邊)
    if(Math.min(ny+fp.hd,a.y2)-Math.max(ny-fp.hd,a.y1)>0.05){
      let d=Math.abs((nx+fp.hw)-a.x1);if(d<bestDX){bestDX=d;sx=a.x1-fp.hw;} // 右緣貼牆左面
      d=Math.abs((nx-fp.hw)-a.x2);if(d<bestDX){bestDX=d;sx=a.x2+fp.hw;}     // 左緣貼牆右面
    }
    // Y 吸附：需 X 向有重疊
    if(Math.min(nx+fp.hw,a.x2)-Math.max(nx-fp.hw,a.x1)>0.05){
      let d=Math.abs((ny+fp.hd)-a.y1);if(d<bestDY){bestDY=d;sy=a.y1-fp.hd;}
      d=Math.abs((ny-fp.hd)-a.y2);if(d<bestDY){bestDY=d;sy=a.y2+fp.hd;}
    }
  }
  return {x:sx,y:sy};
}

// ---- 統一牆 key：'e'+i = 外牆, 'p'+i = 隔間。任何牆都可拆+可還原(FR-003/004) ----
function _wallGroup(key){const i=parseInt(key.slice(1));return key[0]==='e'?(extGroups&&extGroups[i]):(partGroups&&partGroups[i]);}
function _wallObj(key){const i=parseInt(key.slice(1));return key[0]==='e'?(L.layout.exterior&&L.layout.exterior[i]):(L.layout.partitions&&L.layout.partitions[i]);}
// 牆是否為「紅線」（結構/管道/外牆）→ 只影響是否跳安全提示，不擋拆除(FR-005)
function _wallRedline(key){if(key[0]==='e')return true;const w=_wallObj(key);return w?wallFixed(w):false;}
// ---- 3D 牆段鬼影 ----
function setWallGhost(key,ghost){
  const pg=_wallGroup(key);if(!pg)return;
  // 拆除=整段牆「真正消失」(原本 0.12 半透殘影 Rain 嫌沒感覺);還原=顯示。
  pg.visible=!ghost;
}
function setPartGhost(i,ghost){setWallGhost('p'+i,ghost);} // 相容舊呼叫

// ---- 拆牆模式 ----
function toggleDemolishMode(){
  demolishMode=!demolishMode;
  const btn=document.getElementById('demolish-btn');
  if(btn)btn.classList.toggle('active',demolishMode);
  // 拆牆模式：所有牆(外牆+隔間)都高亮可點，紅線牆用不同色但一樣可拆
  document.querySelectorAll('.pwall').forEach(el=>{
    const key=el.dataset.pi;if(!key)return;
    if(demolishMode){el.classList.toggle('demo-redline',_wallRedline(key)&&!demolishedWalls.has(key));el.classList.toggle('demo-highlight',!demolishedWalls.has(key));}
    else el.classList.remove('demo-highlight','demo-redline');
  });
  if(demolishMode)clearWallSel();
}

// 任何牆都可拆+可還原。紅線(外牆/結構/管道)只跳「非阻擋」安全提示(FR-003/004/005)
function handleDemolishClick(key){
  const w=_wallObj(key);if(!w&&key[0]!=='e')return;
  const toggling_off=demolishedWalls.has(key);
  if(!toggling_off&&_wallRedline(key)){
    const reason=(w&&(w.lock_reason||w.kebian_note))||(key[0]==='e'?'外牆／結構牆':'結構/管道牆');
    showDemoToast('⚠️ '+reason+'｜模擬可拆，實際施工須與建商/技師確認');
  }
  if(toggling_off)demolishedWalls.delete(key);else demolishedWalls.add(key);
  _updateDemolishWall(key);
  saveDemolish();
}

function _updateDemolishWall(key){
  const el=document.querySelector('.pwall[data-pi="'+key+'"]');
  const removed=demolishedWalls.has(key);
  if(el){
    el.classList.toggle('demo-removed',removed);
    el.classList.toggle('demo-highlight',demolishMode&&!removed);
    el.classList.toggle('demo-redline',demolishMode&&!removed&&_wallRedline(key));
  }
  setWallGhost(key,removed);
  updateDemoPanel();
  syncContactAO();
}

function restoreDemolishUI(){
  document.querySelectorAll('.pwall').forEach(el=>{
    const key=el.dataset.pi;if(!key)return;
    const removed=demolishedWalls.has(key);
    el.classList.toggle('demo-removed',removed);
    if(demolishMode&&!removed){el.classList.add('demo-highlight');el.classList.toggle('demo-redline',_wallRedline(key));}
  });
}

function updateDemoPanel(){
  const cnt=demolishedWalls.size;
  const panel=document.getElementById('demo-panel');
  const countEl=document.getElementById('demo-count');
  const listEl=document.getElementById('demo-list');
  if(!panel)return;
  panel.style.display=cnt>0?'block':'none';
  if(countEl)countEl.textContent=cnt;
  if(!listEl)return;
  if(cnt===0){listEl.innerHTML='<div class="demo-item">（尚未標記）</div>';return;}
  let h='';
  demolishedWalls.forEach(key=>{
    const w=_wallObj(key);if(!w)return;
    const a=w.a,b=w.b,len=Math.hypot(b[0]-a[0],b[1]-a[1]).toFixed(2);
    const lbl=key[0]==='e'?'外牆':'隔間';
    h+=`<div class="demo-item">${lbl}#${parseInt(key.slice(1))+1} · ${len}m${_wallRedline(key)?' ⚠️':''}</div>`;
  });
  listEl.innerHTML=h;
}

function resetAllDemolish(){
  demolishedWalls.forEach(key=>setWallGhost(key,false));
  demolishedWalls.clear();
  document.querySelectorAll('.pwall.demo-removed').forEach(el=>el.classList.remove('demo-removed'));
  updateDemoPanel();
  syncContactAO();
  saveDemolish();
}

function exportDemolish(){
  if(!demolishedWalls.size){alert('尚未標記任何拆除牆段。');return;}
  let txt='A1 戶客變申請—拆除牆段清單\n================================\n';
  demolishedWalls.forEach(key=>{
    const w=_wallObj(key);if(!w)return;
    const a=w.a,b=w.b,len=Math.hypot(b[0]-a[0],b[1]-a[1]).toFixed(2);
    const lbl=key[0]==='e'?'外牆':'隔間';
    txt+=`${lbl} #${parseInt(key.slice(1))+1}：(${a[0]}m, ${a[1]}m) → (${b[0]}m, ${b[1]}m) · 長 ${len}m${_wallRedline(key)?' ⚠️須技師確認':''}\n`;
  });
  txt+='\n請持本清單向建商確認後提交客變申請書。';
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('已複製到剪貼板！\n\n'+txt)).catch(()=>alert(txt));}
  else alert(txt);
}

function showDemoToast(msg){
  const t=document.getElementById('demo-toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._demoTimer);t._demoTimer=setTimeout(()=>t.classList.remove('show'),2500);
}
// FR-007:樓高 2.4–3.6m 即時調整 — 重建牆/門窗/天花/樑/柱/陽台桿,免重整
function setWallHeight(h){
  WH=Math.max(2.2,Math.min(3.8,parseFloat(h)||2.9));
  try{rebuildExterior();}catch(e){}
  try{rebuildPartitions();}catch(e){}
  if(roofMesh)roofMesh.position.y=WH+0.04;
  _whCols.forEach(o=>{if(!o.m)return;o.m.geometry.dispose();o.m.geometry=new THREE.BoxGeometry(o.c.s[0],WH,o.c.s[1]);o.m.position.y=WH/2;});
  _whBeams.forEach(o=>{if(o.m)o.m.position.y=WH-o.bh/2;});
  if(_whAccent){_whAccent.geometry.dispose();_whAccent.geometry=new THREE.BoxGeometry(3.4,WH-0.08,0.04);_whAccent.position.y=(WH-0.08)/2;}
  _whBalcBars.forEach(o=>{if(o.m)o.m.position.y=WH-o.dy;});
  try{syncContactAO();}catch(e){}
  const v=document.getElementById('wh-val');if(v)v.textContent=WH.toFixed(2)+' m';
}

// ---- localStorage ----
function saveDemolish(){try{localStorage.setItem('a1_demolish',JSON.stringify([...demolishedWalls]));}catch(e){}}
function loadDemolish(){try{const s=localStorage.getItem('a1_demolish');if(s){const arr=JSON.parse(s);arr.forEach(k=>demolishedWalls.add(typeof k==='number'?('p'+k):k));}}catch(e){}}
function saveFurnPos(){try{localStorage.setItem('a1_furniture',JSON.stringify(furnOverride));}catch(e){}}
function loadFurnPos(){try{const s=localStorage.getItem('a1_furniture');if(s){const arr=JSON.parse(s);if(Array.isArray(arr)&&arr.length===L.furniture.length)furnOverride=arr;}}catch(e){}}

function resetFurnPos(){
  furnOverride=L.furniture.map(f=>({x:f.x,y:f.y}));
  saveFurnPos();
  furn3D.forEach((g,i)=>{if(g){const f=L.furniture[i];g.position.set(f.x,0,-f.y);}});
  syncContactAO();
  const on=!!document.querySelector('.tabs button[data-pl="furn"].on');
  build2Dfurn(on);
}

// ---- 家具拖曳 ----
let _dragFi=-1,_dragOrigX=0,_dragOrigY=0,_dragSvgX0=0,_dragSvgY0=0,_lastVX=0,_lastVY=0;

function _svgWorldPt(e){
  const svg=document.getElementById('plan2d');
  if(!svg)return null;
  const pt=svg.createSVGPoint();
  const src=(e.touches&&e.touches[0])||e;
  pt.x=src.clientX;pt.y=src.clientY;
  try{return pt.matrixTransform(svg.getScreenCTM().inverse());}catch(ex){return null;}
}

function initFurnDrag(){
  const svg=document.getElementById('plan2d');
  if(!svg||svg.dataset.dragBound)return;
  svg.dataset.dragBound='1';

  function onDown(e){
    if(!document.querySelector('.tabs button[data-pl="furn"].on'))return;
    const fi=e.target&&e.target.dataset&&e.target.dataset.fi;
    if(fi==null||fi==='')return;
    const i=parseInt(fi);
    if(isNaN(i)||i<0||i>=L.furniture.length)return;
    _dragFi=i;
    const pt=_svgWorldPt(e);if(!pt)return;
    _dragSvgX0=pt.x;_dragSvgY0=pt.y;
    const ov=furnOverride[i]||{x:L.furniture[i].x,y:L.furniture[i].y};
    _dragOrigX=ov.x;_dragOrigY=ov.y;
    _lastVX=_dragOrigX;_lastVY=_dragOrigY;
    e.target.classList.add('fn-drag');
    if(e.pointerId!=null)try{e.target.setPointerCapture(e.pointerId);}catch(ex){}
    e.stopPropagation();e.preventDefault();
  }

  function onMove(e){
    if(_dragFi<0)return;
    const pt=_svgWorldPt(e);if(!pt)return;
    const f=L.furniture[_dragFi],fp=_furnFootprint(f);
    const env=L.project.envelope;
    let nx=snap5cm(_dragOrigX+(pt.x-_dragSvgX0)/SC);
    let ny=snap5cm(_dragOrigY-(pt.y-_dragSvgY0)/SC); // SVG Y is flipped
    nx=Math.max(fp.hw+0.05,Math.min(env.w-fp.hw-0.05,nx));
    ny=Math.max(fp.hd+0.05,Math.min(env.d-fp.hd-0.05,ny));
    const snapped=snapToWalls(_dragFi,nx,ny);nx=snapped.x;ny=snapped.y; // 牆面吸附
    const col=checkFurnCollision(_dragFi,nx,ny);
    const svg2=document.getElementById('plan2d');
    const rect=svg2.querySelector(`.fn[data-fi="${_dragFi}"]`);
    const lbl=svg2.querySelector(`.fn-label[data-fi="${_dragFi}"]`);
    if(rect){rect.setAttribute('x',mx(nx-fp.hw));rect.setAttribute('y',my(ny+fp.hd));rect.classList.toggle('fn-collision',col);}
    if(lbl){lbl.setAttribute('x',mx(nx));lbl.setAttribute('y',my(ny)+5);}
    if(!col){_lastVX=nx;_lastVY=ny;if(furn3D[_dragFi])furn3D[_dragFi].position.set(nx,0,-ny);if(window.A1ContactAO)A1ContactAO.updateFurnitureShadow(_dragFi,nx,ny,isFurnitureVisibleIndex(_dragFi));}
    e.stopPropagation();e.preventDefault();
  }

  function onUp(e){
    if(_dragFi<0)return;
    const i=_dragFi;_dragFi=-1;
    const f=L.furniture[i],fp=_furnFootprint(f);
    furnOverride[i]={x:_lastVX,y:_lastVY};
    const svg2=document.getElementById('plan2d');
    const rect=svg2.querySelector(`.fn[data-fi="${i}"]`);
    const lbl=svg2.querySelector(`.fn-label[data-fi="${i}"]`);
    if(rect){rect.classList.remove('fn-drag','fn-collision');rect.setAttribute('x',mx(_lastVX-fp.hw));rect.setAttribute('y',my(_lastVY+fp.hd));}
    if(lbl){lbl.setAttribute('x',mx(_lastVX));lbl.setAttribute('y',my(_lastVY)+5);}
    if(furn3D[i])furn3D[i].position.set(_lastVX,0,-_lastVY);
    if(window.A1ContactAO)A1ContactAO.updateFurnitureShadow(i,_lastVX,_lastVY,isFurnitureVisibleIndex(i));
    saveFurnPos();
    e.stopPropagation();
  }

  svg.addEventListener('pointerdown',onDown);
  svg.addEventListener('pointermove',onMove,{passive:false});
  svg.addEventListener('pointerup',onUp);
  svg.addEventListener('pointercancel',onUp);
  // touch fallback for browsers without pointer events
  svg.addEventListener('touchstart',onDown,{passive:false});
  svg.addEventListener('touchmove',onMove,{passive:false});
  svg.addEventListener('touchend',onUp,{passive:false});
}

// ---- 初始化 ----
function initEditor(){
  loadDemolish();
  loadFurnPos();
  // Restore 3D ghost for demolished walls (build3D already ran)
  demolishedWalls.forEach(key=>setWallGhost(key,true));
  syncContactAO();
  updateDemoPanel();
  // Bind SVG drag (on the SVG element itself, persists across innerHTML rebuilds)
  initFurnDrag();
  // Wire up furn tab clicks to show/hide furn-reset btn
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      const fr=document.getElementById('furn-reset');
      if(fr)fr.style.display=(b.dataset.pl==='furn')?'':'none';
    });
  });
}
